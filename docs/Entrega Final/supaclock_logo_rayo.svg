<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">SupaClock lightning logo</title>
  <desc id="desc">A modern SupaClock logo with a smartwatch dial, lightning bolt, and biometric pulse line.</desc>
  <defs>
    <linearGradient id="blueRing" x1="170" y1="150" x2="520" y2="510" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36c6e5"/>
      <stop offset="0.48" stop-color="#2f72d8"/>
      <stop offset="1" stop-color="#173f94"/>
    </linearGradient>
    <linearGradient id="boltFill" x1="300" y1="140" x2="440" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe36f"/>
      <stop offset="1" stop-color="#f4a500"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#123d7a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="305" y="76" width="110" height="92" rx="36" fill="#173f94"/>
    <rect x="305" y="492" width="110" height="92" rx="36" fill="#173f94"/>
    <circle cx="360" cy="330" r="178" fill="url(#blueRing)"/>
    <circle cx="360" cy="330" r="132" fill="#ffffff"/>
    <circle cx="360" cy="330" r="108" fill="#eef8ff"/>
  </g>

  <path d="M380 145 L236 358 H333 L293 516 L493 284 H383 Z" fill="url(#boltFill)"/>
  <path d="M207 365 H270 L307 314 L353 435 L402 352 H511" fill="none" stroke="#1c8fd6" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M207 365 H270 L307 314 L353 435 L402 352 H511" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <text x="585" y="306" font-family="Segoe UI, Montserrat, Arial, sans-serif" font-size="108" font-weight="800" letter-spacing="0" fill="#153c82">Supa</text>
    <text x="585" y="414" font-family="Segoe UI, Montserrat, Arial, sans-serif" font-size="108" font-weight="800" letter-spacing="0" fill="#1b9bd7">Clock</text>
    <rect x="589" y="444" width="332" height="12" rx="6" fill="#f4b400"/>
  </g>
</svg>
