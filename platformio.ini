; PlatformIO Project Configuration File

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = espidf
monitor_speed = 115200
build_type = debug
board_build.esp_idf.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
; XIAO ESP32-S3: 8 MB Flash, 8 MB octal PSRAM
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_upload.maximum_size = 8388608
lib_deps = i2c_bus, max30205_driver, bmi160_driver, max30102_driver, st7789_driver, JPEGDEC, lvgl/lvgl@~8.4.0, step_algorithm, max17048_driver, ble_telemetry, ad8232_driver, gpio_buttons, power_modes, ui_theme, ui_fonts, har_cnn1d
build_flags =
	-I include
	-D LV_CONF_INCLUDE_SIMPLE=1
	-D BOARD_HAS_PSRAM=1
	-D ARDUINO_USB_CDC_ON_BOOT=1


[env:main_app]
build_flags = ${env.build_flags} -D ENV_MAIN_APP=1

[env:test_general]
build_flags = ${env.build_flags} -D ENV_TEST_GENERAL=1

[env:test_temp]
build_flags = ${env.build_flags} -D ENV_TEST_TEMP=1

[env:test_imu]
build_flags = ${env.build_flags} -D ENV_TEST_IMU=1

[env:test_spo2]
build_flags = ${env.build_flags} -D ENV_TEST_SPO2=1

[env:test_ecg]
build_flags = ${env.build_flags} -D ENV_TEST_ECG=1

[env:test_ecg_raw]
build_flags = ${env.build_flags} -D ENV_TEST_ECG_RAW=1

[env:test_display]
build_flags = ${env.build_flags} -D ENV_TEST_DISPLAY=1

[env:test_ble]
build_flags = ${env.build_flags} -D ENV_TEST_BLE=1

[env:test_gui]
build_flags = ${env.build_flags} -D ENV_TEST_GUI=1

[env:test_fuel_gauge]
build_flags = ${env.build_flags} -D ENV_TEST_FUEL_GAUGE=1

[env:test_har]
build_flags = ${env.build_flags} -D ENV_TEST_HAR=1

[env:test_fft_steps]
build_flags = ${env.build_flags} -D ENV_TEST_FFT_STEPS=1

; ─────────────────────────────────────────────────────────────────────
; capture_c3 — vuelve al ESP32-C3 SuperMini para colectar dataset HAR.
; Solo BMI160 + BLE (no display, no ECG, no PSRAM). El env hereda lo
; mínimo: redefine board, sdkconfig, lib_deps y build_flags propios.
; Uso:
;   pio run -e capture_c3 -t upload
;   pio device monitor -e capture_c3
; Después, app/dev_mode_screen.dart → seleccionar clase → Record.
; ─────────────────────────────────────────────────────────────────────
[env:capture_c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
build_type = debug
board_build.esp_idf.sdkconfig_defaults = sdkconfig.defaults.c3
board_build.partitions = partitions_c3.csv
board_build.filesystem = spiffs
; SuperMini original = 4 MB; sdkconfig fija FLASHSIZE_DETECT así que aun
; con módulos de 2 MB funciona, sólo se reduce el spiffs.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
lib_deps = i2c_bus, bmi160_driver, ble_telemetry
build_flags =
	-I include
	-D SUPACLOCK_BOARD_C3=1
	-D ENV_TEST_IMU=1

